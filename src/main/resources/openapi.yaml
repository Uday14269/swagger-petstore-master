openapi: 3.0.3
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: Updated API documentation based on PR #3. See paths section for changes.
  version: 1.1.0
servers:
  - url: /api/v1
paths:
  /pet/findByStatus:
    get:
      summary: Finds Pets by status (PR #3 update)
      description: Returns a list of pets based on status. Updated input/output after Java code change in PR #3.
      operationId: findPetsByStatus
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
            default: available
          required: true
          description: Status values that need to be considered for filter
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid status value
    post:
      summary: Add new status search criteria (added in PR #3)
      description: Adds a criteria for pet status filtering.
      operationId: addStatusCriteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                criteria:
                  type: string
                  description: Criteria to filter
      responses:
        '201':
          description: Criteria created
  /pet/{petId}:
    get:
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
