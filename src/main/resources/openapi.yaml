# OpenAPI Specification
openapi: 3.0.0
info:
  title: Swagger Petstore API
  version: 1.0.0
  description: Automatically updated API documentation based on changes in PR #3
servers:
  - url: http://localhost:8080/api
paths:
  /pet:
    get:
      summary: Get all pets
      description: Returns a list of all pets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Add a pet
      description: Adds a new pet to the store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created
  /pet/{petId}:
    get:
      summary: Get pet by ID
      description: Returns a single pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    delete:
      summary: Delete a pet
      description: Deletes a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pet deleted
        '404':
          description: Pet not found
  /pet/{petId}/status:
    put:
      summary: Update pet status
      description: Updates the status of a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: New status for the pet
      responses:
        '200':
          description: Status updated
        '404':
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
