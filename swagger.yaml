openapi: 3.0.0
info:
  title: Swagger Petstore Updated for PR #1
  description: This OpenAPI spec reflects all API changes introduced in PR #1. Validation performed against OpenAPI 3.0 standards. Please refer to the PR description for detailed endpoint and schema changes.
  version: 1.1.0
servers:
  - url: https://petstore.swagger.io/v2
paths:
  /pet:
    post:
      summary: Add a new pet to the store (updated via PR #1)
      operationId: addPet
      tags:
        - pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
  /pet/{petId}:
    get:
      summary: Find pet by ID (modified in PR #1)
      operationId: getPetById
      tags:
        - pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pet found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        status:
          type: string
          description: pet status in the store
          enum:
            - available
            - pending
            - sold
